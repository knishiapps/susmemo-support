<h1>SusMemo サポート</h1>

<p>
SusMemoは、バイクのサスペンションセッティングを記録・管理するアプリです。
</p>

<h2>使い方</h2>
<ul>
<li>車両を追加します</li>
<li>セッティング項目を登録します</li>
<li>ログとして記録します</li>
</ul>

<h2>よくある質問</h2>
<p><b>Q. データはどこに保存されますか？</b><br>
A. すべて端末内に保存されます。</p>

<p><b>Q. データのバックアップはできますか？</b><br>
A. JSON形式でエクスポート・インポートが可能です。</p>
